name: test
on:
  push:
  pull_request:
jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity (tests create a temp repo)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Hook and plan-lint tests
        run: node --test plugins/flow/hooks/test/guard.test.js plugins/flow/hooks/test/guard-allow.test.js plugins/flow/hooks/test/done-gate.test.js plugins/flow/hooks/test/timing.test.js plugins/flow/hooks/test/session-start.test.js plugins/flow/hooks/test/optional-hooks.test.js plugins/flow/hooks/test/shared.test.js plugins/flow/bin/plan-lint.test.js
